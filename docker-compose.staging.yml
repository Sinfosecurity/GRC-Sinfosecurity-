# Isolated Supreme Risk staging dependencies.
# Never point these services at production tenant data.
name: supreme-risk-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: supreme-staging-postgres
    environment:
      POSTGRES_USER: supreme_staging
      POSTGRES_PASSWORD: supreme_staging
      POSTGRES_DB: supreme_risk_staging
    ports:
      - "55434:5432"
    volumes:
      - supreme_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supreme_staging -d supreme_risk_staging"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: supreme-staging-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: supreme-staging-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stagingminio
      MINIO_ROOT_PASSWORD: stagingminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - supreme_staging_minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: supreme-staging-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set staging http://minio:9000 stagingminio stagingminio123;
      mc mb -p staging/supreme-risk-staging || true;
      mc anonymous set none staging/supreme-risk-staging || true;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: supreme-staging-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  supreme_staging_pg:
  supreme_staging_minio:
